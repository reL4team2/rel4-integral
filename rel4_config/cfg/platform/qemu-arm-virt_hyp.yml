# cpu arch
cpu:
  arch: aarch64
  freq: 62500000

# timer settings
timer:
  - {label: "CLK_MAGIC", value: 4611686019}
  - {label: "CLK_SHIFT", value: 58}
  - {label: "TIMER_PRECISION", value: 0}  
  - {label: "TIMER_OVERHEAD_TICKS", value: 0}
  - {label: "CONFIGURE_KERNEL_WCET", value: 10}

# device messages
device:
  device_region:
    - {paddr: 0x9000000, pptr_offset: 0x0, arm_execute_never: 2, user_available: 1, desc: "uart"}
    - {paddr: 0x8000000, pptr_offset: 0x1000, arm_execute_never: 2, user_available: 0, desc: "gicv2_distributor"}
    - {paddr: 0x8010000, pptr_offset: 0x2000, arm_execute_never: 2, user_available: 0, desc: "gicv2_controller"}
    - {paddr: 0x8030000, pptr_offset: 0x3000, arm_execute_never: 2, user_available: 0, desc: "gicv2_vcpu_ctrl"}
  irqs:
    - {label: "INTERRUPT_VTIMER_EVENT", number: 27}
    - {label: "KERNEL_TIMER_IRQ", number: 26}
    - {label: "MAX_IRQ", number: 159}
    - {label: "IRQ_INVALID", number: 65535}
    - {label: "NUM_PPI", number: 32}
    - {label: "NUM_PPI_MINUS_ONE", number: 31}

# memory layout
memory:
  vmem_offset: 0x8000000000
  pmem_start: 0x60000000
  kernel_start: 0x60000000
  avail_mem_zone:
    - {start: 0x60000000, end: 0xC0000000}
  stack_bits: 12 # 2^12 4K
